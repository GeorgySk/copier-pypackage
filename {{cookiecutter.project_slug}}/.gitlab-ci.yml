{%- set py_minor = cookiecutter.python_version.split(".")[1] | int -%}
# Keep the jobs and commands in sync with .github/workflows/ci.yml (if present).
stages: [lint, test, build, publish]

variables:
  PYTHON_VERSION: "{{ cookiecutter.python_version }}"
  POETRY_VERSION: "{{ cookiecutter.poetry_version }}"

# Run for merge requests, the default branch and tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Final releases only: tags like v1.2.3, not v1.2.3-alpha.
.release-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.poetry:
  image: python:$PYTHON_VERSION
  before_script:
    - pip install "poetry==${POETRY_VERSION}"
    - poetry install --with dev

lint:
  extends: .poetry
  stage: lint
  script:
    - poetry run ruff check .
    - poetry run ruff format --check .

test:
  extends: .poetry
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: [{% for minor in range(py_minor, 15) %}"3.{{ minor }}"{{ ", " if not loop.last }}{% endfor %}]
  script:
    - poetry run pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# In the test stage, so broken docs block publishing.
docs:
  image: python:$PYTHON_VERSION
  stage: test
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - poetry install --with docs
    - poetry run sphinx-build -W --keep-going -b html docs/source docs/build/html

build:
  image: python:$PYTHON_VERSION
  stage: build
  script:
    - pip install "poetry==${POETRY_VERSION}"
    - poetry build
  artifacts:
    paths:
      - dist/
{%- if cookiecutter.ci_provider == "gitlab" %}
{#- With ci_provider == "both", GitHub publishes to PyPI: a second upload of
    the same version would fail. #}

publish-pypi:
  extends: .release-rules
  image: python:$PYTHON_VERSION
  stage: publish
  # PYPI_API_TOKEN: masked, protected CI/CD variable holding a PyPI API token
  script:
    - |
      version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
      if [ "${CI_COMMIT_TAG#v}" != "${version}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match version ${version}"
        exit 1
      fi
    - pip install "poetry==${POETRY_VERSION}"
    - poetry publish --username __token__ --password "${PYPI_API_TOKEN}"
{%- endif %}
{%- if cookiecutter.use_docker_compose == "yes" %}

publish-docker:
  extends: .release-rules
  image: docker:cli
  services:
    - docker:dind
  stage: publish
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies: []
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login --username "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - |
      export $(grep -E '^(PYTHON_IMAGE_VERSION|POETRY_VERSION)=' .env | xargs)
      version="${CI_COMMIT_TAG#v}"
      docker build \
        --build-arg PYTHON_IMAGE_VERSION="${PYTHON_IMAGE_VERSION}" \
        --build-arg POETRY_VERSION="${POETRY_VERSION}" \
        --build-arg IMAGE_TYPE=prod \
        --tag "${CI_REGISTRY_IMAGE}:${version}" \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        .
      docker push "${CI_REGISTRY_IMAGE}:${version}"
      docker push "${CI_REGISTRY_IMAGE}:latest"
{%- endif %}
