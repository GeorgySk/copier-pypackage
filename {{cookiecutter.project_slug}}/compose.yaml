services:
  {{cookiecutter.project_slug}}:
    build:
      context: .
      args:
        - PYTHON_IMAGE_VERSION=${PYTHON_IMAGE_VERSION}
        - POETRY_VERSION=${POETRY_VERSION}
        - DEV_IMAGE=${DEV_IMAGE}
    image: {{ cookiecutter.github_username.lower() }}/{{cookiecutter.project_slug}}:{{cookiecutter.version}}
    volumes:
      - .:/opt/{{cookiecutter.project_slug}}
    stdin_open: true
    tty: true
