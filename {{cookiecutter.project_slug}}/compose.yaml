version: '3'

services:
  {{cookiecutter.project_slug}}:
    build:
      context: .
      args:
        - PYTHON_IMAGE_VERSION=${PYTHON_IMAGE_VERSION}
        - POETRY_VERSION=${POETRY_VERSION}
        - DEV_IMAGE=${DEV_IMAGE}
    image: {{ cookiecutter.github_username.lower() }}/{{cookiecutter.project_slug}}:{{cookiecutter.version}}
    volumes:
      - ./{{cookiecutter.project_slug}}/:/opt/{{cookiecutter.project_slug}}/{{cookiecutter.project_slug}}/
      - ./tests/:/opt/{{cookiecutter.project_slug}}/tests/
      - ./README.md:/opt/{{cookiecutter.project_slug}}/README.md
      - ./.bumpversion.toml:/opt/{{cookiecutter.project_slug}}/.bumpversion.toml
      - ./.env:/opt/{{cookiecutter.project_slug}}/.env
      - ./Dockerfile:/opt/{{cookiecutter.project_slug}}/Dockerfile
      - ./LICENSE:/opt/{{cookiecutter.project_slug}}/LICENSE
      - ./MANIFEST.in:/opt/{{cookiecutter.project_slug}}/MANIFEST.in
      - ./compose.yaml:/opt/{{cookiecutter.project_slug}}/compose.yaml
      - ./pyproject.toml:/opt/{{cookiecutter.project_slug}}/pyproject.toml
    stdin_open: true
    tty: true
