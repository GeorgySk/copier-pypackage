[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = ""
authors = [
    { name = "Georgy Skorobogatov", email = "skorobogatovgeorgy+github@gmail.com" },
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = "^{{ cookiecutter.python_version }}"
dependencies = []

[dependency-groups]
docs = [
    "Sphinx>=8.1.3,<9.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0",
    "tomli>=2.4.0,<3.0.0"
]
dev = [
    "bump-my-version>=1.2.6,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    # fixed for easier way to reproduce across various machines
    "hypothesis==6.150.2"
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.coverage.run]
source = ["{{ cookiecutter.project_slug }}"]

[tool.pytest.ini_options]
addopts = "--verbose -s --hypothesis-profile=default"
