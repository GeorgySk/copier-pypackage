version: 2
updates:
  # Poetry: pyproject.toml (+ poetry.lock, if committed)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
{%- if cookiecutter.use_devcontainer == "yes" %}
  # .devcontainer/devcontainer.json
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
{%- endif %}
