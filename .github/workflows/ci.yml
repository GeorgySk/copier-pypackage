# CI for the template repo itself (the generated project has its own
# workflow under template/, in a conditionally named .github directory).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .env is the single source of truth for the Python and Poetry versions.
      - name: Read tool versions from .env
        run: grep -E '^(PYTHON_IMAGE_VERSION|POETRY_VERSION)=' .env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_IMAGE_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev --no-root
      - name: Check code
        run: poetry run ruff check .
      - name: Type check
        run: poetry run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tests need Python >= 3.11 (tomllib, check-jsonschema).
        # Raise the upper bound by hand when a new Python is released.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history with tags: test_update.py updates projects
          # rendered from the latest release tag.
          fetch-depth: 0
      - name: Read tool versions from .env
        run: grep -E '^POETRY_VERSION=' .env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev --no-root
      - name: Run tests
        run: poetry run pytest --hypothesis-profile=ci

  # Installs a rendered project and runs its own tooling (pytest -m tooling).
  tooling:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The generated project's minimum Python and the latest one.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Read tool versions from .env
        run: grep -E '^POETRY_VERSION=' .env >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - name: Install dependencies
        run: poetry install --with dev --no-root
      - name: Run tooling tests
        run: poetry run pytest -m tooling

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image-type: [dev, prod]
    steps:
      - uses: actions/checkout@v7
      # Python and Poetry versions come from .env; IMAGE_TYPE overrides it.
      - name: Build image
        run: docker compose build
        env:
          IMAGE_TYPE: ${{ matrix.image-type }}

  # Builds and starts the dev container (compose.yaml + the Dockerfile's dev
  # stage) and checks that Poetry and the dev dependencies are there.
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: devcontainers/ci@v0.3
        with:
          imageName: copier-pypackage-devcontainer
          push: never
          runCmd: poetry --version && python -m pytest --collect-only -q
