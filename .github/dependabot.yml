version: 2
updates:
  # Poetry: pyproject.toml + poetry.lock, and the generated project's dev and
  # docs dependencies in template-dependencies/pyproject.toml. One entry, so
  # that a grouped update (Ruff, pinned in both) is a single pull request.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/template-dependencies"
    # Raise the lower bounds too, so new projects start from current
    # versions.
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  # .devcontainer/devcontainer.json + devcontainer-lock.json
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
  # .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
