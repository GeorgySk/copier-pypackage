[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "copier-pypackage"
version = "0.28.3-alpha"
description = ""
authors = [
    { name = "Georgy Skorobogatov", email = "skorobogatovgeorgy+github@gmail.com" },
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    "copier (>=9.10.0,<10.0.0)"
]

[tool.poetry.group.dev.dependencies]
bump-my-version = "^1.8.1"
pytest = "^9.2.0"
# fixed for easier way to reproduce across various machines
hypothesis = "^6.168.5"
check-jsonschema = "^0.39.0"
actionlint-py = "^1.7.12.25"
pyyaml = "^6.0.3"
# keep in sync with the generated project's dev group and pre-commit rev
ruff = "0.17.4"
mypy = "^2.4.1"
types-pyyaml = "^6.0.12"

# Same rules as the generated project's [tool.ruff]
[tool.ruff]
line-length = 79
src = [".", "tests"]
# The generated project's Jinja-templated files don't parse.
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]

# Same strictness as the generated project's [tool.mypy].
[tool.mypy]
strict = true
files = ["tests"]

[tool.pytest.ini_options]
# Tooling tests need network and take minutes: run them with -m tooling
addopts = "--verbose -s --hypothesis-profile=default -m 'not tooling'"
markers = [
    "tooling: installs and runs a generated project's own tools (slow, needs network)",
]
testpaths = ["tests"]
# pytest's defaults plus the template directory: the template's own tests/
# belong to the generated project and must not be collected here
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "template",
]
