[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cookiecutter-pyproject"
version = "0.15.0"
description = ""
authors = [
    { name = "Georgy Skorobogatov", email = "skorobogatovgeorgy+github@gmail.com" },
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = "^3.10"
dependencies = [
    "cookiecutter (>=2.6.0,<3.0.0)"
]

[tool.poetry.group.dev.dependencies]
bump-my-version = "^1.2.6"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
# fixed for easier way to reproduce across various machines
hypothesis = "^6.150.2"

[tool.coverage.run]
source = ["hooks"]

[tool.pytest.ini_options]
addopts = "--verbose -s --hypothesis-profile=default"
