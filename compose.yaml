services:
  copier-pypackage:
    build:
      context: .
      args:
        - PYTHON_IMAGE_VERSION=${PYTHON_IMAGE_VERSION}
        - POETRY_VERSION=${POETRY_VERSION}
        - IMAGE_TYPE=${IMAGE_TYPE}
    image: georgysk/copier-pypackage:0.29.0
    volumes:
      - .:/opt/copier-pypackage
    stdin_open: true
    tty: true
