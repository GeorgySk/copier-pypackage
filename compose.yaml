services:
  cookiecutter-pypackage:
    build:
      context: .
      args:
        - PYTHON_IMAGE_VERSION=${PYTHON_IMAGE_VERSION}
        - POETRY_VERSION=${POETRY_VERSION}
        - IMAGE_TYPE=${IMAGE_TYPE}
    image: georgysk/cookiecutter-pypackage:0.19.0
    volumes:
      - .:/opt/cookiecutter-pypackage
    stdin_open: true
    tty: true
