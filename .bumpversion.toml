[tool.bumpversion]
commit = false
tag = false
current_version = "0.8.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\-(?P<release>[a-z]+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}",
    "{major}.{minor}.{patch}"
]

[tool.bumpversion.parts.release]
optional_value = "beta"
values = [
	"alpha",
	"beta"
]
